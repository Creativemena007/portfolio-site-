<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life away from the screen — Mena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* Neue Haas Grotesk Display — the site's UI font, self-hosted so this page
     matches the rest of the portfolio (Instrument Serif stays for the headline). */
  @font-face{font-family:'Neue Haas';src:url(/fonts/NeueHaasDisplayRoman.ttf) format('truetype');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:'Neue Haas';src:url(/fonts/NeueHaasDisplayMediu.ttf) format('truetype');font-weight:500;font-style:normal;font-display:swap;}
  @font-face{font-family:'Neue Haas';src:url(/fonts/NeueHaasDisplayBold.ttf) format('truetype');font-weight:700;font-style:normal;font-display:swap;}

  :root{
    --ground:#101010;
    --ground-lift:#1c1b18;
    --cream:#fdfcf8;
    --cream-dim:rgba(253,252,248,.55);
    --label:#726f64;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    height:100vh;overflow:hidden;
    background-color:var(--ground);
    background-image:radial-gradient(circle, rgb(255 255 255 / 0.035) 1px, transparent 1px);
    background-size:26px 26px;
    color:var(--cream);
    font-family:'Neue Haas',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- top nav (visual bar only; drag passes underneath) ---------- */
  .site-nav{
    position:fixed;top:0;left:0;right:0;z-index:40;
    border-bottom:1px solid rgba(255,255,255,.05);
    background:rgba(16,16,16,.55);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    pointer-events:none;   /* let drags start under the bar */
  }
  .site-nav .nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;padding:16px 32px}
  .site-nav a{
    pointer-events:auto;
    display:inline-flex;align-items:center;gap:10px;
    font-family:'Neue Haas',sans-serif;
    font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
    color:var(--label);text-decoration:none;transition:color .2s ease;
  }
  .site-nav a:hover,.site-nav a:focus-visible{color:var(--cream)}
  .site-nav svg{width:16px;height:16px;transition:transform .2s ease}
  .site-nav a:hover svg{transform:translateX(-3px)}

  /* ---------- draggable viewport + wall ---------- */
  .viewport{
    position:fixed;inset:0;z-index:2;
    overflow:hidden;
    cursor:grab;
    touch-action:none;               /* we handle panning ourselves */
  }
  .viewport.grabbing{cursor:grabbing}
  .wall{
    position:absolute;top:0;left:0;
    width:2240px;height:1520px;
    will-change:transform;
  }
  /* used briefly when keyboard focus pans the wall to a tile */
  .wall.animate{transition:transform .42s cubic-bezier(.2,.8,.3,1)}

  /* ---------- central statement (floats in the middle of the wall) ---------- */
  .statement{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    text-align:center;width:560px;max-width:80vw;
    z-index:3;pointer-events:none;   /* never blocks a drag */
  }
  .eyebrow{
    font-size:12px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;
    color:var(--label);margin-top:40px;
  }
  h1{
    font-family:'Instrument Serif',serif;font-weight:400;
    font-size:clamp(44px,7vw,84px);line-height:.98;letter-spacing:-.01em;color:var(--cream);
  }
  h1 em{font-style:italic}

  /* ---------- photo tiles ---------- */
  .tile{
    position:absolute;width:var(--w);
    border:none;background:none;color:inherit;text-align:left;
    transform:rotate(var(--r,0deg));
    transition:transform .3s cubic-bezier(.2,.8,.3,1.2);
    z-index:2;padding:0;
  }
  .tile:focus-visible{transform:rotate(0deg) scale(1.06);z-index:5;outline:2px solid var(--cream);outline-offset:4px}
  /* hover lift only on real pointers so a tap on touch doesn't stick */
  @media (hover:hover) and (pointer:fine){
    .tile:hover{transform:rotate(0deg) scale(1.06);z-index:5}
  }
  /* press feedback — a real depress on pointer-down (§1 response) */
  .tile:active{transform:rotate(0deg) scale(0.97);transition:transform .12s ease-out}
  .tile .ph{
    width:100%;aspect-ratio:var(--ar,4/5);
    background:var(--ground-lift);
    box-shadow:0 14px 30px -12px rgba(0,0,0,.85), inset 0 0 0 1px rgba(253,252,248,.07);
    overflow:hidden;display:flex;align-items:center;justify-content:center;
    pointer-events:none;             /* clicks handled on the button */
  }
  .tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
  /* Cape Town selfie is very tall — bias the cover-crop to the bottom so the
     trimmed part comes off the top (sky/building), keeping the subject. */
  .tile .ph img[src$="la-21.jpg"]{object-position:center bottom}
  .tile .ph .empty{
    font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cream-dim);opacity:.7;text-align:center;padding:0 8px;
  }
  .tile figcaption{
    margin-top:9px;
    font-size:9.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
    color:var(--cream-dim);pointer-events:none;
  }

  /* ---------- hint + sign-off ---------- */
  .hint{
    position:fixed;left:50%;bottom:64px;transform:translateX(-50%);
    z-index:6;pointer-events:none;
    font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
    color:var(--cream-dim);
    text-shadow:0 1px 10px rgba(0,0,0,.85);   /* stay legible over any photo behind */
    transition:opacity .5s ease;
  }
  .hint.gone{opacity:0}
  .footnote{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    z-index:6;pointer-events:none;
    font-size:13px;letter-spacing:.06em;color:var(--cream-dim);
    text-shadow:0 1px 10px rgba(0,0,0,.85);
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:50;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:32px;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .lightbox.open{opacity:1;pointer-events:auto}
  .lb-ph{
    width:min(560px,86vw);aspect-ratio:var(--ar,4/5);max-height:74vh;
    background:var(--ground-lift);
    box-shadow:0 40px 70px -20px rgba(0,0,0,.7);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    touch-action:pan-y;
    transform-origin:center;
    /* transform: grows from / returns to the clicked photo.
       opacity+filter: quick blur-crossfade when paging prev/next. */
    transition:transform .42s cubic-bezier(.2,.8,.3,1), opacity .16s ease, filter .16s ease;
  }
  .lb-ph.swapping{opacity:0;filter:blur(3px)}
  .lb-ph img{width:100%;height:100%;object-fit:cover}
  .lb-ph .empty{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-dim)}
  .lb-cap{
    font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--cream-dim);
    display:flex;gap:14px;align-items:center;
  }
  .lb-cap .idx{color:var(--label)}
  .lb-close{
    position:fixed;top:24px;right:28px;
    background:none;border:none;color:var(--cream);
    font-family:'Neue Haas',sans-serif;font-size:12px;font-weight:500;
    letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:8px;opacity:.8;transition:opacity .2s ease;
  }
  .lb-close:hover{opacity:1}
  .lb-nav{
    position:fixed;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--cream);cursor:pointer;padding:16px;
    opacity:.65;transition:opacity .2s ease,transform .2s ease;
  }
  .lb-nav:hover{opacity:1}
  .lb-prev{left:12px}.lb-prev:hover{transform:translateY(-50%) translateX(-3px)}
  .lb-next{right:12px}.lb-next:hover{transform:translateY(-50%) translateX(3px)}
  .lb-nav svg{width:30px;height:30px}

  @media (max-width:760px){
    .lb-nav{padding:10px}.lb-nav svg{width:24px;height:24px}
    .hint{bottom:56px}
  }
  @media (prefers-reduced-motion:reduce){
    /* gentler, not zero: drop the transform-based motion, keep opacity fades */
    .tile,.wall,.lb-ph,.site-nav a,.site-nav svg{transition:none !important}
    .lb-ph{transition:opacity .16s ease !important}
  }
</style>
  <!-- Agentation dev feedback toolbar — CDN-loaded, localhost only.
       The import map is inert until the guarded module below runs, so nothing
       is fetched and no toolbar renders in production. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.2.4",
      "react-dom": "https://esm.sh/react-dom@19.2.4",
      "react-dom/client": "https://esm.sh/react-dom@19.2.4/client",
      "react/jsx-runtime": "https://esm.sh/react@19.2.4/jsx-runtime",
      "agentation": "https://esm.sh/agentation@3.0.2?external=react,react-dom"
    }
  }
  </script>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="/">
      <svg viewBox="0 0 256 256" fill="none" aria-hidden="true">
        <polyline points="136 96 88 48 40 96" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="232 192 88 192 88 48" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Home
    </a>
  </div>
</nav>

<div class="viewport" id="viewport">
  <div class="wall" id="wall">
    <div class="statement">
      <h1>Life away<br>from <em>the screen</em></h1>
      <p class="eyebrow">Marathoner. Author. Tourist</p>
    </div>
  </div>
</div>

<p class="hint" id="hint">drag to explore ↔</p>
<p class="footnote">see you out there — x</p>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo">
  <button class="lb-close" id="lbClose">Close ✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="lb-ph" id="lbPh"></div>
  <p class="lb-cap"><span id="lbCap"></span><span class="idx" id="lbIdx"></span></p>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<script>
/*
  Drop your 15–20 photos in here. Set `src` to fill a slot (empty = placeholder).
  left/top are % of the 2400×1700 wall; w is tile width px; r is rotation;
  ar is aspect ratio ('4/5','3/2','1/1'). The centre is kept clear for the
  statement — positions live in a ring around it.
*/
const photos = [
  // inner ring — hugging the headline
  { src:'/images/life-away/la-01.jpg', caption:'MADE A FRIEND.jpeg',    left:24, top:32, w:170, r:-4, ar:'4/5' },
  { src:'/images/life-away/la-02.jpg', caption:'THE PLAYGROUND.jpeg',   left:44, top:26, w:200, r:2,  ar:'3/2' },
  { src:'/images/life-away/la-03.jpg', caption:'CYCLING.jpeg', left:58, top:24, w:175, r:-3, ar:'4/5' },
  { src:'/images/life-away/la-04.jpg', caption:'MANGO RICE.jpeg',         left:70, top:34, w:150, r:3,  ar:'4/5' },
  { src:'/images/life-away/la-06.jpg', caption:'MARATHONER.jpeg',      left:66, top:64, w:150, r:4,  ar:'3/4' },
  { src:'/images/life-away/la-07.jpg', caption:'BALI.jpeg',      left:40, top:66, w:145, r:-5, ar:'4/5' },
  { src:'/images/life-away/la-08.jpg', caption:'TABLE MOUNTAIN.jpeg',      left:26, top:54, w:145, r:6,  ar:'4/5' },
  // outer ring — just beyond
  { src:'/images/life-away/la-09.jpg', caption:'STREET FOOD.jpeg',        left:12, top:22, w:160, r:-4, ar:'3/2' },
  { src:'/images/life-away/la-11.jpg', caption:'FLOWER BOY.jpeg',     left:52, top:12, w:160, r:-2, ar:'3/2' },
  { src:'/images/life-away/la-12.jpg', caption:'DOCUMENTING.jpeg',      left:74, top:16, w:160, r:2,  ar:'3/2' },
  { src:'/images/life-away/la-13.jpg', caption:'SUNDAY RESET.jpeg',     left:88, top:26, w:160, r:-2, ar:'3/2' },
  { src:'/images/life-away/la-14.jpg', caption:'SIMON TOWN.jpeg',    left:10, top:44, w:140, r:3,  ar:'4/5' },
  { src:'/images/life-away/la-15.jpg', caption:'SINGAPORE.jpeg',      left:90, top:46, w:160, r:-5, ar:'3/2' },
  { src:'/images/life-away/la-16.jpg', caption:'CATCHING FLIGHT.jpeg',         left:12, top:66, w:140, r:4,  ar:'4/5' },
  { src:'/images/life-away/la-17.jpg', caption:'RAMEN.jpeg',      left:88, top:66, w:140, r:5,  ar:'4/5' },
  { src:'/images/life-away/la-18.jpg', caption:'DUBAI SKY DINNER.jpeg',        left:30, top:80, w:140, r:4,  ar:'4/5' },
  { src:'/images/life-away/la-19.jpg', caption:'BOOK SIGNING.jpeg',   left:50, top:82, w:160, r:-3, ar:'3/2' },
  { src:'/images/life-away/la-20.jpg', caption:'BESTMAN DUTY.jpeg',        left:70, top:80, w:160, r:-4, ar:'3/2' },
  { src:'/images/life-away/la-21.jpg', caption:'CAPETOWN.jpeg',           left:36, top:4,  w:150, r:-6, ar:'3/4' }
];

/* ---------- build the wall ---------- */
const wall = document.getElementById('wall');
const tiles = [];
/* On phones, compact the wall so you land on a cluster of photos. Tiles run a
   bit larger than the horizontal spread, and the vertical spread is generous to
   use the free top/bottom room. */
const MOB = window.matchMedia('(max-width:760px)').matches;
const STILE = MOB ? 0.5 : 1;   // tile size (bigger than the 0.4 spread → fills top/bottom room)
const SX    = MOB ? 0.4 : 1;   // horizontal spread + wall width (the "close to perfect" cluster)
const SY    = MOB ? 0.4 : 1;   // vertical spread + wall height
photos.forEach((p,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tile';
  btn.style.setProperty('--w', (p.w * STILE) + 'px');
  btn.style.setProperty('--r', p.r+'deg');
  btn.style.setProperty('--ar', p.ar);
  btn.setAttribute('aria-label', p.caption);   // position set by layoutTiles()
  btn.innerHTML = `
    <figure>
      <div class="ph">${p.src ? `<img src="${p.src}" alt="" loading="lazy" draggable="false">` : `<span class="empty">${p.caption}</span>`}</div>
      <figcaption>${p.caption}</figcaption>
    </figure>`;
  btn.addEventListener('click', ()=>{ if(!moved) openLightbox(i, btn); });
  // keyboard focus pans the wall so an off-screen tile becomes visible (§16)
  btn.addEventListener('focus', ()=>revealTile(btn));
  tiles.push(btn);
  wall.appendChild(btn);
});

/* ---------- drag to pan (with inertia) ---------- */
const vp = document.getElementById('viewport');
const hint = document.getElementById('hint');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const WALL_W = Math.round(2240 * SX), WALL_H = Math.round(1520 * SY);
wall.style.width = WALL_W + 'px';
wall.style.height = WALL_H + 'px';

/* Rhythmic scatter: place photos on two evenly-spaced orbital rings around
   the centre statement. Even angular spacing removes the clumping/overlap of
   hand-placed positions; a small radius wobble keeps it feeling organic. */
function tileHeight(p){ const [a,b] = p.ar.split('/').map(Number); return p.w * (b / a); }
function layoutTiles(){
  const CX = WALL_W/2, CY = WALL_H/2, N = photos.length;
  const innerN = Math.max(1, Math.round(N / 3));
  const rings = [
    { n: innerN,     rx: 570*SX, ry: 440*SY, phase: -Math.PI/2 },
    { n: N - innerN, rx: 980*SX, ry: 645*SY, phase: -Math.PI/2 + Math.PI / (N - innerN) }
  ];
  let i = 0;
  rings.forEach(ring=>{
    for(let k = 0; k < ring.n && i < N; k++, i++){
      const p = photos[i], btn = tiles[i];
      const ang = ring.phase + (k / ring.n) * Math.PI * 2;
      const jit = ((i * 13) % 7 - 3) * 7 * STILE;    // organic wobble (scaled)
      const cx = CX + (ring.rx + jit) * Math.cos(ang);
      const cy = CY + (ring.ry + jit) * Math.sin(ang);
      btn.style.left = (cx - p.w / 2) + 'px';
      btn.style.top  = (cy - tileHeight(p) / 2) + 'px';
    }
  });
}
layoutTiles();

let posX = 0, posY = 0;
let dragging = false, moved = false;
let sx = 0, sy = 0, spx = 0, spy = 0;
let vX = 0, vY = 0, lastX = 0, lastY = 0, lastT = 0, raf = 0;
let revealT = 0;

/* pan bounds: wall edges may not reveal empty space past them */
function boundsX(){ const vw = vp.clientWidth; return WALL_W <= vw ? [(vw-WALL_W)/2,(vw-WALL_W)/2] : [vw-WALL_W, 0]; }
function boundsY(){ const vh = vp.clientHeight; return WALL_H <= vh ? [(vh-WALL_H)/2,(vh-WALL_H)/2] : [vh-WALL_H, 0]; }
/* Apple's rubber-band resistance (Designing Fluid Interfaces) */
function rb(over, dim){ const c = 0.55; return (over*dim*c) / (dim + c*over); }
function softX(raw){ const [mn,mx] = boundsX(), vw = vp.clientWidth; if(raw<mn) return mn - rb(mn-raw,vw); if(raw>mx) return mx + rb(raw-mx,vw); return raw; }
function softY(raw){ const [mn,mx] = boundsY(), vh = vp.clientHeight; if(raw<mn) return mn - rb(mn-raw,vh); if(raw>mx) return mx + rb(raw-mx,vh); return raw; }
function hardClamp(){ const [xn,xx]=boundsX(),[yn,yx]=boundsY(); posX=Math.max(xn,Math.min(xx,posX)); posY=Math.max(yn,Math.min(yx,posY)); }
function apply(){ wall.style.transform = `translate(${posX}px, ${posY}px)`; }

/* start centred on the statement */
function center(){
  posX = (vp.clientWidth - WALL_W)/2;
  posY = (vp.clientHeight - WALL_H)/2;
  hardClamp(); apply();
}
center();
window.addEventListener('resize', ()=>{ hardClamp(); apply(); });

function hideHint(){ hint.classList.add('gone'); }

/* keyboard focus → glide the wall so the focused tile is on-screen */
function revealTile(btn){
  const pad = 90, navH = 64, vw = vp.clientWidth, vh = vp.clientHeight;
  const tl = btn.offsetLeft, tt = btn.offsetTop, tw = btn.offsetWidth, th = btn.offsetHeight;
  if(tl + posX < pad) posX = pad - tl;
  else if(tl + tw + posX > vw - pad) posX = vw - pad - tl - tw;
  if(tt + posY < navH + pad) posY = navH + pad - tt;
  else if(tt + th + posY > vh - pad) posY = vh - pad - tt - th;
  hardClamp();
  wall.classList.add('animate'); apply();
  clearTimeout(revealT); revealT = setTimeout(()=>wall.classList.remove('animate'), 440);
}

vp.addEventListener('pointerdown', e=>{
  dragging = true; moved = false;
  vp.setPointerCapture(e.pointerId);
  wall.classList.remove('animate');
  sx = e.clientX; sy = e.clientY; spx = posX; spy = posY;
  lastX = e.clientX; lastY = e.clientY; lastT = e.timeStamp;
  vX = vY = 0; cancelAnimationFrame(raf);
  vp.classList.add('grabbing');
});
vp.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if(Math.abs(dx) + Math.abs(dy) > 6){ moved = true; hideHint(); }
  posX = softX(spx + dx); posY = softY(spy + dy); apply();   // rubber-band past edges
  const dt = (e.timeStamp - lastT) || 16;
  vX = (e.clientX - lastX) / dt * 16;
  vY = (e.clientY - lastY) / dt * 16;
  lastX = e.clientX; lastY = e.clientY; lastT = e.timeStamp;
});
function endDrag(){
  if(!dragging) return;
  dragging = false; vp.classList.remove('grabbing');
  if(reduceMotion){ hardClamp(); apply(); return; }
  /* unified settle: inertia while inside bounds, spring-back when past them */
  (function settle(){
    const [xn,xx] = boundsX(), [yn,yx] = boundsY();
    let cont = false;
    if(posX < xn || posX > xx){ const t = posX<xn?xn:xx; posX += (t-posX)*0.2; vX=0; if(Math.abs(t-posX)>0.5) cont=true; else posX=t; }
    else { posX += vX; vX *= 0.92; if(Math.abs(vX)>0.25 || posX<xn || posX>xx) cont=true; }
    if(posY < yn || posY > yx){ const t = posY<yn?yn:yx; posY += (t-posY)*0.2; vY=0; if(Math.abs(t-posY)>0.5) cont=true; else posY=t; }
    else { posY += vY; vY *= 0.92; if(Math.abs(vY)>0.25 || posY<yn || posY>yx) cont=true; }
    apply();
    if(cont) raf = requestAnimationFrame(settle);
  })();
}
vp.addEventListener('pointerup', endDrag);
vp.addEventListener('pointercancel', endDrag);

/* ---------- lightbox with prev / next ---------- */
const lightbox = document.getElementById('lightbox');
const lbPh = document.getElementById('lbPh');
let lbIndex = 0;

let lastOrigin = null;

function renderLb(){
  const p = photos[lbIndex];
  lbPh.style.setProperty('--ar', p.ar);
  lbPh.innerHTML = p.src ? `<img src="${p.src}" alt="">` : `<span class="empty">${p.caption}</span>`;
  document.getElementById('lbCap').textContent = p.caption;
  document.getElementById('lbIdx').textContent =
    String(lbIndex+1).padStart(2,'0') + ' / ' + String(photos.length).padStart(2,'0');
  lastOrigin = tiles[lbIndex];   // close returns to the photo currently shown
}

/* transform the lightbox photo to sit over a tile, then release so it grows in */
function transformToTile(el){
  const ph = el && el.querySelector('.ph');
  if(!ph) return false;
  const tr = ph.getBoundingClientRect(), lr = lbPh.getBoundingClientRect();
  if(!lr.width) return false;
  const s = tr.width / lr.width;
  const tx = (tr.left + tr.width/2) - (lr.left + lr.width/2);
  const ty = (tr.top + tr.height/2) - (lr.top + lr.height/2);
  lbPh.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  return true;
}

function openLightbox(i, originEl){
  lbIndex = i; renderLb();
  lightbox.classList.add('open');
  if(originEl && !reduceMotion){
    requestAnimationFrame(()=>{
      lbPh.style.transition = 'none';
      if(transformToTile(originEl)){
        requestAnimationFrame(()=>{ lbPh.style.transition = ''; lbPh.style.transform = ''; });
      } else { lbPh.style.transition = ''; }
    });
  }
  document.getElementById('lbClose').focus();
}
function closeLightbox(){
  if(lastOrigin && !reduceMotion && transformToTile(lastOrigin)){
    lightbox.classList.remove('open');
    setTimeout(()=>{ lbPh.style.transition='none'; lbPh.style.transform=''; requestAnimationFrame(()=>{ lbPh.style.transition=''; }); }, 430);
  } else {
    lightbox.classList.remove('open');
  }
}
let swapT = 0;
function lbStep(d){
  const next = ()=>{ lbIndex = (lbIndex + d + photos.length) % photos.length; renderLb(); };
  if(reduceMotion){ next(); return; }
  // blur-crossfade: fade the current photo out, swap, fade the next in (§blur bridges the swap)
  lbPh.classList.add('swapping');
  clearTimeout(swapT);
  swapT = setTimeout(()=>{ next(); requestAnimationFrame(()=>lbPh.classList.remove('swapping')); }, 150);
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', ()=>lbStep(-1));
document.getElementById('lbNext').addEventListener('click', ()=>lbStep(1));
lightbox.addEventListener('click', e=>{ if(e.target === lightbox) closeLightbox(); });

/* swipe within the lightbox photo */
let swX = 0, swActive = false;
lbPh.addEventListener('pointerdown', e=>{ swActive = true; swX = e.clientX; });
lbPh.addEventListener('pointerup', e=>{
  if(!swActive) return; swActive = false;
  const d = e.clientX - swX;
  if(Math.abs(d) > 45) lbStep(d < 0 ? 1 : -1);
});

document.addEventListener('keydown', e=>{
  if(lightbox.classList.contains('open')){
    if(e.key === 'Escape') closeLightbox();
    else if(e.key === 'ArrowRight') lbStep(1);
    else if(e.key === 'ArrowLeft') lbStep(-1);
  } else if(e.key === 'Escape'){
    window.location.href = '/';
  }
});
</script>
  <script type="module">
    // Mount Agentation only on localhost so it never ships to production.
    if (["localhost", "127.0.0.1"].includes(location.hostname)) {
      try {
        const { createElement } = await import("react");
        const { createRoot } = await import("react-dom/client");
        const { Agentation } = await import("agentation");
        const root = document.createElement("div");
        document.body.appendChild(root);
        createRoot(root).render(createElement(Agentation));
      } catch (e) {
        console.error("Agentation failed to load", e);
      }
    }
  </script>
