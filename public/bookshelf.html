<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The shelf — books I keep coming back to</title>
<meta name="description" content="Books that have shaped me — the ones I keep coming back to.">
<link rel="canonical" href="https://www.thecreativemena.com/bookshelf">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mena">
<meta property="og:title" content="The shelf — books I keep coming back to">
<meta property="og:description" content="Books that have shaped me — the ones I keep coming back to.">
<meta property="og:url" content="https://www.thecreativemena.com/bookshelf">
<meta property="og:image" content="https://www.thecreativemena.com/opengraph-image">

<link rel="apple-touch-icon" href="/apple-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wdth,wght@62..125,100..900&family=Space+Grotesk:wght@400;500;700&family=Shantell+Sans:wght@500;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'Dream Baser';
    src:url(/fonts/DreamBaser-Bold.ttf) format('truetype') format('truetype');
    font-weight:700;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:'Dream Baser';
    src:url(/fonts/DreamBaser-Regular.ttf) format('truetype') format('truetype');
    font-weight:400;font-style:normal;font-display:swap;
  }

  /* Neue Haas Grotesk Display — the site's own UI font, self-hosted here so
     this standalone page matches the rest of the portfolio. */
  @font-face{font-family:'Neue Haas';src:url(/fonts/NeueHaasDisplayRoman.ttf) format('truetype');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:'Neue Haas';src:url(/fonts/NeueHaasDisplayMediu.ttf) format('truetype');font-weight:500;font-style:normal;font-display:swap;}
  @font-face{font-family:'Neue Haas';src:url(/fonts/NeueHaasDisplayBold.ttf) format('truetype');font-weight:700;font-style:normal;font-display:swap;}

  :root{
    /* Dark mode: page chrome goes dark, books keep their real colours.
       --page-ink / --page-muted keep the opened book's paper interior
       readable (dark text on the cream page). */
    --wall:#101010;
    --ink:#F2EFE8;
    --muted:#8F8B82;
    --shelf:#2A2925;
    --paper:#FBFAF6;
    --page-ink:#1A1918;
    --page-muted:#8B877E;
    --bw:320px;   /* open book cover width */
    --bh:440px;   /* open book cover height */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--wall);
    color:var(--ink);
    font-family:'Neue Haas','Space Grotesk',sans-serif;
    overflow-x:hidden;
    background-image:radial-gradient(circle, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:26px 26px;
  }

  /* ---------- header ---------- */
  header{
    max-width:1060px;margin:0 auto;
    padding:72px 32px 8px;
    text-align:center;
  }
  .eyebrow{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);margin-bottom:18px;
  }
  h1{
    font-family:'Instrument Serif',serif;
    font-weight:400;
    font-size:clamp(40px,6vw,68px);
    line-height:1.02;
    letter-spacing:-.01em;
  }
  h1 em{font-style:italic}
  .sub{
    margin-top:16px;color:var(--muted);font-size:15px;line-height:1.5;
    max-width:44ch;margin-left:auto;margin-right:auto;
  }

  /* ---------- shelf ---------- */
  .shelf-wrap{
    max-width:1060px;margin:0 auto;
    padding:40px 32px 120px;
  }
  /* The shelf is as wide as its books plus a pair of bookends, so the
     collection reads as curated rather than lost on a long plank. */
  .shelf{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    width:fit-content;
    margin:0 auto;
    padding:0 40px;
    min-height:310px;
    position:relative;
  }
  @media (min-width:1000px){
    /* Books are the content: a little bigger on wide screens. */
    .shelf{transform:scale(1.12);transform-origin:bottom center}
  }
  .bookend{
    flex:0 0 auto;
    width:9px;height:132px;
    margin:0 6px;
    background:linear-gradient(90deg,#3b3a35,#2c2b27);
    border-radius:2px 2px 0 0;
    box-shadow:inset 1px 0 0 rgba(255,255,255,.08), 0 0 0 rgba(0,0,0,0);
    position:relative;
  }
  .bookend::after{
    content:"";position:absolute;bottom:0;height:5px;width:34px;
    background:#2c2b27;border-radius:1px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    z-index:-1;   /* the foot slides under the books */
  }
  .bookend.start::after{left:0}
  .bookend.end::after{right:0}
  /* Contact shadow where each book meets the plank. */
  .book::after{
    content:"";position:absolute;left:1px;right:1px;bottom:-2px;height:4px;
    background:rgba(0,0,0,.55);filter:blur(2px);z-index:1;
    pointer-events:none;
  }
  .shelf::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-14px;height:14px;
    /* a lit top lip + deeper ambient shadow so the ledge reads as a real
       physical shelf against the dark wall (§12 depth) */
    background:linear-gradient(var(--shelf), #201f1c);
    border-radius:2px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 22px 34px -14px rgba(0,0,0,.65);
  }

  .book{
    position:relative;
    border:none;
    cursor:pointer;
    flex:0 0 auto;
    width:var(--w);
    height:var(--h);
    background:var(--c);
    color:var(--t);
    display:flex;
    align-items:center;
    justify-content:center;
    transform-origin:bottom center;
    transition:transform .35s cubic-bezier(.2,.9,.3,1.2), box-shadow .35s ease, opacity .2s ease;
    box-shadow:inset -3px 0 6px rgba(0,0,0,.18), inset 2px 0 3px rgba(255,255,255,.15), 2px 0 0 rgba(26,25,24,.08);
    margin:0 1px;
  }
  /* Lifted state — keyboard focus applies it always; hover only on real
     pointers (§14) so a tap on touch doesn't leave a book stuck raised. */
  .book:focus-visible{
    transform:translateY(-20px) rotate(-2deg);
    box-shadow:inset -3px 0 6px rgba(0,0,0,.18), inset 2px 0 3px rgba(255,255,255,.15), 0 24px 30px -14px rgba(0,0,0,.6);
    z-index:3;
    outline:2px solid var(--ink);outline-offset:4px;
  }
  .book.leaning{
    transform:rotate(-7deg) translateX(6px);
    z-index:2;
    box-shadow:inset -3px 0 6px rgba(0,0,0,.18), 8px 10px 18px -10px rgba(0,0,0,.5);
  }
  .book.leaning:focus-visible{transform:rotate(-7deg) translate(6px,-16px)}
  @media (hover:hover) and (pointer:fine){
    .book:hover{
      transform:translateY(-20px) rotate(-2deg);
      box-shadow:inset -3px 0 6px rgba(0,0,0,.18), inset 2px 0 3px rgba(255,255,255,.15), 0 24px 30px -14px rgba(0,0,0,.6);
      z-index:3;
    }
    .book.leaning:hover{transform:rotate(-7deg) translate(6px,-16px)}
  }
  /* Press feedback (§1) — instant depress on pointer-down, before the fly-out */
  .book:active{transform:translateY(-14px) scale(.985);transition:transform .12s ease-out}
  .book.taken{opacity:0;pointer-events:none}

  /* First-load: spines rise onto the shelf in a gentle stagger (delight
     budget — a rare, high-emotion view). Per-book delay set in JS. */
  @media (prefers-reduced-motion:no-preference){
    @keyframes book-rise{from{opacity:0;transform:translateY(20px)}}
    .book{animation:book-rise .55s cubic-bezier(.2,.9,.3,1) backwards}

    /* Header rises in on load too, so the shelf isn't the only thing that
       animates. Same easing/feel as the site's home-page `.enter` entrance;
       staggered so it lands as the shelf finishes rising. */
    @keyframes head-rise{from{opacity:0;transform:translateY(10px)}}
    .eyebrow,h1,.sub,.hint{animation:head-rise .5s cubic-bezier(.23,1,.32,1) both}
    h1{animation-delay:80ms}
    .sub{animation-delay:160ms}
    .hint{animation-delay:240ms}
  }

  .spine{
    writing-mode:vertical-rl;
    display:flex;align-items:center;gap:14px;
    height:100%;
    padding:20px 0;
  }
  .spine .title{font-size:var(--fs,16px)}
  .spine .author{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}

  /* per-book type personalities */
  .t-kleon .title{font-family:'Archivo';font-weight:900;letter-spacing:.02em;text-transform:uppercase}
  .t-rubin .title{font-family:'Instrument Serif',serif;letter-spacing:.28em;text-transform:uppercase;font-weight:400}
  .t-mena  .title{font-family:'Space Grotesk';font-weight:700;letter-spacing:.08em;text-transform:lowercase}
  .t-show  .title{font-family:'Space Grotesk';font-weight:700;letter-spacing:.18em;text-transform:uppercase}
  .t-naval .title{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
  .t-clear .title{font-family:'Archivo';font-weight:600;letter-spacing:.02em}
  .t-build .title{font-family:'Archivo';font-stretch:62%;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
  .t-berger .title{font-family:'Archivo';font-stretch:125%;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

  .hint{
    text-align:center;margin-top:52px;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  }

  /* ---------- real spine layouts ---------- */
  .spine-real{
    writing-mode:vertical-rl;
    height:100%;width:100%;
    display:flex;align-items:center;
    padding:14px 0;
  }
  /* Build — Tony Fadell (Harper Business hardback) */
  .sp-build{font-family:'Archivo';color:#141414;justify-content:flex-start;gap:14px}
  .sp-build .bs-author{
    font-stretch:72%;font-weight:800;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;
    border-inline-end:1.5px solid #141414;
    border-inline-start:1.5px solid #141414;
    padding-inline:5px;
  }
  .sp-build .bs-title{
    font-stretch:72%;font-weight:900;font-size:26px;
    letter-spacing:.04em;text-transform:uppercase;
  }
  .sp-build .bs-sub{
    font-stretch:62%;font-weight:600;font-size:8px;
    letter-spacing:.06em;text-transform:uppercase;
    opacity:.85;
  }
  .sp-build .bs-pub{
    margin-inline-start:auto;
    width:10px;height:10px;border-radius:50%;
    background:#141414;opacity:.85;
  }
  /* The Alchemist — Paulo Coelho (25th anniversary hardback) */
  .sp-alch{
    font-family:'Instrument Serif',serif;color:#3B2010;
    justify-content:space-between;
    box-shadow:inset 3px 0 0 #B23A2A, inset -3px 0 0 #B23A2A;
    padding:10px 0;
  }
  .sp-alch .al-orn{
    font-size:11px;color:#B23A2A;line-height:1;
    text-align:center;
  }
  .sp-alch .al-author{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    margin-block:0;margin-inline-start:14px;
  }
  .sp-alch .al-title{
    font-size:15px;letter-spacing:.16em;text-transform:uppercase;
    margin-inline-start:auto;margin-inline-end:14px;
  }
  .sp-alch .al-title em{
    font-style:italic;text-transform:none;
    font-size:12px;letter-spacing:.02em;
  }
  /* Don't grow up — Orezi Mena (trade paperback) */
  .sp-mena{
    font-family:'Dream Baser','Shantell Sans',sans-serif;color:#fff;
    justify-content:flex-start;padding:16px 0;
  }
  .sp-mena .m-title{font-size:13px;font-weight:700;letter-spacing:.03em}
  .sp-mena .m-author{
    margin-inline-start:auto;
    font-family:'Space Grotesk';font-size:7.5px;font-weight:500;
    letter-spacing:.2em;text-transform:uppercase;opacity:.9;
  }
  /* The almanack of Naval Ravikant (white paperback) */
  .sp-naval{
    font-family:'Archivo';color:#1B1B1B;
    justify-content:flex-start;padding:18px 0;
  }
  .sp-naval .n-title{
    font-size:10.5px;font-weight:500;
    letter-spacing:.24em;text-transform:uppercase;
  }
  .sp-naval .n-author{
    margin-inline-start:auto;
    font-size:7px;font-weight:500;
    letter-spacing:.2em;text-transform:uppercase;opacity:.6;
  }

  /* ---------- custom cover recreations ---------- */
  .coverCustom{position:absolute;inset:0;display:none;border-radius:2px 6px 6px 2px;overflow:hidden}
  .coverFront.has-custom .coverCustom{display:flex}
  .coverFront.has-custom .cover-genre,
  .coverFront.has-custom .cover-year,
  .coverFront.has-custom .cover-title,
  .coverFront.has-custom .cover-author{visibility:hidden}

  /* Don't grow up — cover (from the real FULL_COVER artwork) */
  .dgu-cover{
    flex:1;display:flex;flex-direction:column;
    background:#02883F;color:#fff;
    padding:40px 34px 28px;
    font-family:'Dream Baser','Shantell Sans',sans-serif;
    position:relative;overflow:hidden;
  }
  .dgu-title{
    font-weight:700;
    font-size:62px;line-height:.98;
    letter-spacing:-.01em;
    position:relative;z-index:2;
  }
  .dgu-title .w{display:block}
  .dgu-title .c-yellow{color:#E1FF00;border-bottom:5px solid #E1FF00;line-height:.8}
  .dgu-title .c-pink{color:#F4A0FF;border-bottom:5px solid #F4A0FF;line-height:.8}
  .dgu-title .c-mint{color:#50FF7C;border-bottom:5px solid #50FF7C;line-height:.8}
  .dgu-author{
    margin-top:auto;text-align:center;
    font-weight:400;font-size:17px;letter-spacing:.02em;
    position:relative;z-index:2;
  }

  /* Kleon spines — hand lettering */
  .sp-steal,.sp-show{font-family:'Permanent Marker';justify-content:center;gap:8px;padding:10px 0}
  .sp-steal{color:#FAFAF7}
  .sp-show{color:#171717}
  .sp-steal .k-title,.sp-show .k-title{font-size:9px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
  .sp-steal .k-author,.sp-show .k-author{font-size:6.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;line-height:1}

  /* Kleon covers — Steal (black) and Show Your Work! (yellow) */
  .cv-steal,.cv-show{
    flex:1;position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    font-family:'Permanent Marker';padding:44px 34px 38px;
  }
  .cv-steal{background:#171717;color:#FAFAF7}
  .cv-show{background:#F2BF4B;color:#171717}
  .cvs-title{font-size:42px;line-height:1.08;letter-spacing:.02em;text-transform:uppercase}
  .cvs-sub{margin-top:14px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;max-width:32ch}
  .cvs-author{margin-top:12px;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
  .cvs-ed{
    position:absolute;top:18px;left:0;right:0;
    font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#F2BF4B;
  }
  .cvs-dot{
    position:absolute;top:32px;right:24px;
    width:62px;height:62px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:'Archivo';font-weight:700;font-size:6.5px;
    letter-spacing:.06em;text-transform:uppercase;
    padding:9px;transform:rotate(6deg);
  }
  .cv-steal .cvs-dot{background:#E8442E;color:#fff}
  .cv-show .cvs-dot{background:#171717;color:#F2BF4B}

  /* The Creative Act — linen cloth hardback */
  .sp-rubin{font-family:'Instrument Serif',serif;color:#141414;justify-content:flex-start;gap:12px;padding:18px 0}
  .sp-rubin .r-title{font-size:13px;letter-spacing:.04em}
  .sp-rubin .r-mark{
    width:12px;height:12px;flex:0 0 auto;
    border:1.5px solid #141414;border-radius:50%;position:relative;
  }
  .sp-rubin .r-mark::after{
    content:"";position:absolute;inset:0;margin:auto;
    width:4px;height:4px;background:#141414;border-radius:50%;
  }
  .sp-rubin .r-author{font-size:12px}
  .sp-rubin .r-pub{margin-inline-start:auto;font-family:'Archivo';font-weight:900;font-size:9px;letter-spacing:.04em}

  .cv-rubin{
    flex:1;position:relative;
    background:#DBDCD3;color:#141414;
    font-family:'Instrument Serif',serif;
  }
  .cv-rubin::before{
    content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px);
  }
  .cvr-ring{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-54%);
    width:56%;aspect-ratio:1;
    border:9px solid #1A1A18;border-radius:50%;
  }
  .cvr-ring::after{
    content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:17%;height:17%;background:#1A1A18;border-radius:50%;
  }
  .cvr-top{
    position:absolute;top:24px;right:24px;
    writing-mode:vertical-rl;
    font-size:13px;line-height:1.35;letter-spacing:.02em;
  }
  .cvr-author{
    position:absolute;bottom:24px;right:24px;
    writing-mode:vertical-rl;font-size:13px;
  }

  /* Contagious — Jonah Berger (orange hardback) */
  .sp-berger{
    font-family:'Instrument Serif',serif;color:#2E1A08;
    justify-content:flex-start;gap:16px;padding:18px 0;
  }
  .sp-berger .bg-title{font-size:15px;letter-spacing:.02em}
  .sp-berger .bg-bulb{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px}
  .sp-berger .bg-bulb .spark{
    font-size:11px;line-height:1;color:#FDF6E8;
    text-shadow:0 0 4px rgba(255,250,235,.9);
    writing-mode:horizontal-tb;
  }
  .sp-berger .bg-bulb .base{
    width:7px;height:6px;border-radius:1px;
    background:repeating-linear-gradient(0deg,#C9A038 0 1.5px,#8F6D1E 1.5px 3px);
  }
  .sp-berger .bg-author{font-size:9px;letter-spacing:.22em;text-transform:uppercase;font-family:'Archivo';font-weight:600}
  .sp-berger .bg-pub{
    margin-inline-start:auto;
    font-size:8px;opacity:.7;writing-mode:horizontal-tb;
  }

  .cv-berger{
    flex:1;position:relative;
    background:#E87A22;color:#2E1A08;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:30px 30px 34px;
  }
  .cv-berger .bgc-nyt{
    font-family:'Archivo';font-weight:600;font-size:9px;
    letter-spacing:.3em;text-transform:uppercase;
  }
  .cv-berger .bgc-title{
    margin-top:14px;
    font-family:'Instrument Serif',serif;
    font-size:48px;line-height:1;
  }
  .cv-berger .bgc-sub{
    margin-top:12px;
    font-family:'Archivo';font-weight:600;font-size:11px;
    letter-spacing:.32em;text-transform:uppercase;color:#FDF6E8;
  }
  .cv-berger .bgc-bulb{
    margin:auto 0;
    display:flex;flex-direction:column;align-items:center;
  }
  .cv-berger .bgc-bulb .spark{
    font-size:84px;line-height:.9;color:#FDF6E8;
    text-shadow:0 0 18px rgba(255,250,235,.85), 0 0 40px rgba(255,250,235,.4);
    transform:rotate(8deg);
  }
  .cv-berger .bgc-bulb .stem{width:3px;height:26px;background:#241505}
  .cv-berger .bgc-bulb .base{
    width:34px;height:26px;border-radius:3px 3px 8px 8px;
    background:repeating-linear-gradient(0deg,#D9AE3E 0 4px,#8F6D1E 4px 8px);
  }
  .cv-berger .bgc-author{
    font-family:'Archivo';font-weight:600;font-size:15px;
    letter-spacing:.3em;text-transform:uppercase;
  }

  /* Atomic Habits — James Clear (cream paperback, gold halftone type) */
  .ah-gold{color:#C08A35}
  @supports (background-clip:text) or (-webkit-background-clip:text){
    .ah-gold{
      background-image:radial-gradient(circle, #B8842F .9px, rgba(184,132,47,.25) 1.1px, transparent 1.3px);
      background-size:3.5px 3.5px;
      -webkit-background-clip:text;background-clip:text;
      color:transparent;
    }
  }
  .sp-clear{
    font-family:'Archivo';color:#1A1918;
    justify-content:flex-start;gap:12px;padding:16px 0;
  }
  .sp-clear .ah-title{font-weight:800;font-size:15px;letter-spacing:.01em}
  .sp-clear .ah-author{font-weight:700;font-size:9px;letter-spacing:.02em;line-height:1.2}
  .sp-clear .ah-pub{
    margin-inline-start:auto;flex:0 0 auto;
    width:9px;height:13px;background:#C33B26;
  }

  .cv-clear{
    flex:1;position:relative;
    background:#F7F4EC;color:#1A1918;
    font-family:'Archivo';
    display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:26px 30px 30px;
  }
  .cv-clear .ah-nyt{font-weight:600;font-size:8.5px;letter-spacing:.34em;text-transform:uppercase}
  .cv-clear .ah-tag{margin-top:12px;font-weight:800;font-size:17px;line-height:1.25}
  .cv-clear .ah-big{
    margin:auto 0;
    font-weight:800;font-size:56px;line-height:1.02;letter-spacing:0;
  }
  .cv-clear .ah-badge{
    position:absolute;right:26px;bottom:118px;
    width:58px;height:58px;border-radius:50%;
    background:#E06A28;color:#FDF6E8;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-weight:700;font-size:7px;letter-spacing:.06em;text-transform:uppercase;
    padding:8px;transform:rotate(-8deg);
  }
  .cv-clear .ah-sub{font-weight:600;font-size:10.5px;line-height:1.5;max-width:26ch}
  .cv-clear .ah-author{margin-top:14px;font-weight:800;font-size:22px}

  /* ---------- 3D stage ---------- */
  .backdrop{
    position:fixed;inset:0;z-index:40;
    background:rgba(26,25,24,.42);
    backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;
    transition:opacity .45s ease;
  }
  .backdrop.show{opacity:1;pointer-events:auto}

  .stage{
    position:fixed;inset:0;z-index:50;
    display:none;
    align-items:center;justify-content:center;
    perspective:2200px;
    pointer-events:none;
  }
  .stage.on{display:flex}

  .book3d{
    position:relative;
    width:var(--bw);height:var(--bh);
    transform-style:preserve-3d;
    pointer-events:auto;
    will-change:transform;
  }
  /* Open ~1.1s in all (fly 550ms, cover starts swinging before it lands);
     put back ~0.5s: leaving is quicker than arriving. */
  .book3d.moving{
    transition:transform .55s cubic-bezier(.25,.85,.25,1);
  }
  .book3d.moving.closing{
    transition-duration:.42s;
    transition-timing-function:cubic-bezier(.77,0,.175,1);
  }
  .book3d.closing .coverFlap{transition-duration:.3s}
  /* Swapping to the previous/next book while open. */
  .book3d .faces-swap{transition:opacity .16s ease, transform .16s ease}

  /* --- box faces --- */
  .face{position:absolute;top:0;left:0}

  .spineFace{
    width:var(--d);height:100%;
    left:50%;margin-left:calc(var(--d) / -2);
    background:var(--c);color:var(--t);
    transform:rotateY(-90deg) translateZ(calc(var(--bw) / 2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset -3px 0 6px rgba(0,0,0,.18);
  }
  .spineFace .spine{padding:20px 0}

  .backFace{
    inset:0;
    background:var(--back, var(--c));
    transform:rotateY(180deg) translateZ(calc(var(--d) / 2));
    border-radius:2px 6px 6px 2px;
    filter:brightness(.95);
  }

  /* page block fore-edge — visible as the book turns */
  .pagesFace{
    width:calc(var(--d) - 4px);height:calc(100% - 10px);
    top:5px;left:50%;margin-left:calc((var(--d) - 4px) / -2);
    background:repeating-linear-gradient(90deg,
      var(--edge, #EDE7DA) 0 1px, #F9F5EB 1px 3px);
    transform:rotateY(90deg) translateZ(calc(var(--bw) / 2 - 3px));
    box-shadow:inset 0 0 8px rgba(0,0,0,.12);
  }

  /* the page block sits just beneath the cover */
  .pageFace{
    inset:0;
    background:var(--paper);
    color:var(--page-ink);
    transform:translateZ(calc(var(--d) / 2 - 3px));
    border-radius:0 4px 4px 0;
    box-shadow:inset 12px 0 22px -14px rgba(0,0,0,.22), inset -2px 0 0 rgba(0,0,0,.05);
    padding:40px 34px 32px;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .pageFace .why-label{
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--page-muted);
    margin-bottom:16px;
  }
  .pageFace .note{
    font-family:'Instrument Serif',serif;
    font-size:17px;line-height:1.5;
    flex:1;overflow-y:auto;
    /* soft bottom edge instead of a hard cut when a note runs long (§12) */
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),transparent);
    mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),transparent);
  }
  .pageFace .buy{
    margin-top:22px;align-self:flex-start;
    font-size:13px;font-weight:500;
    color:var(--page-ink);text-decoration:none;
    border-bottom:1px solid var(--page-ink);
    padding-bottom:2px;
  }
  @media (hover:hover) and (pointer:fine){.pageFace .buy:hover{opacity:.55}}
  .pageFace .buy span{display:inline-block;transition:transform .2s ease}
  @media (hover:hover) and (pointer:fine){.pageFace .buy:hover span{transform:translateX(4px)}}

  /* --- hinged front cover --- */
  .coverFlap{
    inset:0;
    transform-style:preserve-3d;
    transform-origin:left center;
    transform:translateZ(calc(var(--d) / 2));
    transition:transform .6s cubic-bezier(.3,.75,.25,1);
  }
  .book3d.opened .coverFlap{
    transform:translateZ(calc(var(--d) / 2)) rotateY(-165deg);
  }
  .coverFront,.coverBack{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:2px 6px 6px 2px;
  }
  .coverFront{
    background:var(--c);color:var(--t);
    padding:44px 36px;
    display:flex;flex-direction:column;justify-content:space-between;
    box-shadow:inset 4px 0 8px -4px rgba(0,0,0,.3), inset -2px 0 4px rgba(255,255,255,.12);
    overflow:hidden;
  }
  .coverFront .coverImg{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;
    opacity:0;transition:opacity .3s ease;
    border-radius:2px 6px 6px 2px;
  }
  .coverFront.has-img .coverImg{opacity:1}
  .coverFront.has-img .cover-genre,
  .coverFront.has-img .cover-year,
  .coverFront.has-img .cover-title,
  .coverFront.has-img .cover-author{visibility:hidden}
  /* keep the hardback sheen on top of real covers */
  .coverFront::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    border-radius:2px 6px 6px 2px;
    box-shadow:inset 4px 0 8px -4px rgba(0,0,0,.35), inset -2px 0 4px rgba(255,255,255,.15);
  }
  .coverFront .cover-genre,.coverFront .cover-year{
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;
  }
  .coverFront .cover-title{font-size:clamp(26px,4vw,38px);line-height:1.05}
  .coverFront .cover-author{
    margin-top:12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.8;
  }
  .coverBack{
    transform:rotateY(180deg);
    background:var(--c);
    box-shadow:inset -8px 0 16px -8px rgba(0,0,0,.25);
    display:flex;align-items:flex-end;justify-content:center;
    padding:0 0 34px;
  }
  /* Inside the cover: a library pocket with its checkout card. */
  .coverBack::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:rgba(0,0,0,.08);pointer-events:none;
  }
  .pocket{
    position:relative;width:78%;
  }
  /* The pocket's front covers only the blank foot of the card. */
  .pocket::after{
    content:"";position:absolute;left:-6px;right:-6px;bottom:-12px;height:62px;z-index:1;
    background:#E9E1CD;
    border-radius:2px 2px 3px 3px;
    box-shadow:0 -1px 0 rgba(0,0,0,.05), 0 8px 16px -8px rgba(0,0,0,.45);
    background-image:linear-gradient(transparent 14px, rgba(60,45,20,.14) 14px 15px, transparent 15px);
  }
  .card{
    position:relative;z-index:0;
    background:#FBF6E9;
    color:#2A2620;
    border-radius:2px;
    padding:14px 16px 58px;
    transform:rotate(-2deg);
    box-shadow:0 2px 6px rgba(0,0,0,.18);
    font-size:10px;
  }
  .card .card-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#8B7F68;
    padding-bottom:8px;border-bottom:1px solid rgba(139,127,104,.35);
  }
  .card .card-title{
    font-family:'Instrument Serif',serif;font-size:19px;line-height:1.15;
    margin:10px 0 2px;color:#2A2620;
  }
  .card .card-author{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6E6452}
  .card dl{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
  .card dt{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8B7F68}
  .card dd{font-size:10.5px;color:#2A2620;border-bottom:1px dotted rgba(139,127,104,.5);padding-bottom:3px}
  .card .stamp{
    position:absolute;right:12px;top:66px;
    padding:4px 8px;
    border:1.5px solid #C2410C;border-radius:3px;
    color:#C2410C;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    transform:rotate(-9deg);opacity:.78;
    mix-blend-mode:multiply;
  }

  /* shadow under the floating book */
  .book3d::after{
    content:"";
    position:absolute;left:8%;right:8%;bottom:-46px;height:30px;
    background:radial-gradient(ellipse at center, rgba(26,25,24,.4), transparent 68%);
    transform:rotateX(88deg) translateZ(-30px);
    opacity:0;transition:opacity .5s ease .3s;
  }
  .stage.on .book3d::after{opacity:1}

  /* Top nav — mirrors the site's sticky detail-page nav (backdrop blur,
     bottom hairline, tracked uppercase label). Sits above the backdrop (40)
     and stage (50) so "Put it back" stays reachable while a book is open,
     just like "Next project" on the case-study pages. */
  .site-nav{
    position:sticky;top:0;z-index:60;
    border-bottom:1px solid rgba(255,255,255,.05);
    background:rgba(16,16,16,.7);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .site-nav .nav-inner{
    max-width:1060px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 32px;
  }
  .site-nav a,.nav-close{
    display:inline-flex;align-items:center;gap:10px;
    font-family:'Neue Haas','Space Grotesk',sans-serif;
    font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
    color:#726F64;text-decoration:none;
    transition:color .2s ease,opacity .3s ease;
  }
  .site-nav a:focus-visible,.nav-close:focus-visible{color:#FDFCF8}
  @media (hover:hover) and (pointer:fine){.site-nav a:hover,.nav-close:hover{color:#FDFCF8}}
  .site-nav svg,.nav-close svg{width:16px;height:16px;transition:transform .2s ease}
  @media (hover:hover) and (pointer:fine){.site-nav a:hover svg{transform:translateX(-3px)}}
  /* "Put it back" — right nav item; hidden until a book is open. Slides in a
     few px alongside the fade so the new action reads as arriving (§state). */
  .nav-close{
    background:none;border:none;cursor:pointer;padding:0;
    opacity:0;pointer-events:none;transform:translateX(-4px);
    transition:color .2s ease,opacity .3s ease,transform .3s cubic-bezier(.23,1,.32,1);
  }
  .nav-close.show{opacity:1;pointer-events:auto;transform:translateX(0)}
  .nav-close svg{width:13px;height:13px}
  @media (hover:hover) and (pointer:fine){.nav-close:hover svg{transform:rotate(90deg)}}
  /* while a book is open, lift nav labels off the dimmed backdrop (§12 vibrancy) */
  body.reading .site-nav a,
  body.reading .nav-close{color:#A0A09D}
  body.reading .site-nav a:focus-visible,body.reading .nav-close:focus-visible{color:#FDFCF8}
  @media (hover:hover) and (pointer:fine){body.reading .site-nav a:hover,body.reading .nav-close:hover{color:#FDFCF8}}

  /* Previous / next while a book is open. */
  .book-nav{
    position:fixed;left:50%;bottom:max(24px, env(safe-area-inset-bottom));z-index:60;
    display:flex;align-items:center;gap:6px;
    transform:translate(-50%, 6px);opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .3s cubic-bezier(.23,1,.32,1);
    font-family:'Neue Haas','Space Grotesk',sans-serif;
  }
  .book-nav.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  .book-nav button{
    width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.1);
    background:rgba(28,27,24,.82);color:#E9E7E1;cursor:pointer;
    display:grid;place-items:center;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    transition:transform .16s ease-out, background-color .2s ease;
  }
  .book-nav button:active{transform:scale(.94)}
  .book-nav button:focus-visible{outline:2px solid #f58404;outline-offset:3px}
  @media (hover:hover) and (pointer:fine){.book-nav button:hover{background:rgba(48,47,43,.9)}}
  .book-nav svg{width:16px;height:16px}
  .book-nav .count{
    min-width:64px;text-align:center;
    font-size:12px;letter-spacing:.14em;color:#A0A09D;font-variant-numeric:tabular-nums;
  }

  /* The hint goes away once you've opened a book; the spark beside it stays. */
  .hint-text{transition:opacity .4s ease}
  body.has-opened .hint-text{opacity:0}

  /* cover type personalities mirror the spines */
  .t-kleon .cover-title{font-family:'Archivo';font-weight:900;text-transform:uppercase}
  .t-rubin .cover-title{font-family:'Instrument Serif',serif;letter-spacing:.16em;text-transform:uppercase;font-weight:400}
  .t-mena  .cover-title{font-family:'Space Grotesk';font-weight:700;letter-spacing:.02em;text-transform:lowercase}
  .t-show  .cover-title{font-family:'Space Grotesk';font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .t-naval .cover-title{font-family:'Instrument Serif',serif;letter-spacing:.08em;text-transform:uppercase;font-weight:400}
  .t-clear .cover-title{font-family:'Archivo';font-weight:600}
  .t-alch  .cover-title{font-family:'Instrument Serif',serif;letter-spacing:.12em;text-transform:uppercase;font-weight:400}
  .t-build .cover-title{font-family:'Archivo';font-stretch:62%;font-weight:900;text-transform:uppercase}
  .t-berger .cover-title{font-family:'Archivo';font-stretch:125%;font-weight:700;text-transform:uppercase}

  @media (max-width:760px){
    :root{--bw:min(300px, 82vw);--bh:min(420px, 115vw)}
    .shelf{transform:scale(.72);transform-origin:bottom center;min-height:260px;padding:0 24px}
    /* Two pages side by side don't fit a portrait screen, so on phones the
       cover swings up over the top edge instead (the open spread stacks
       vertically and is scaled to fit in JS). */
    .coverFlap{transform-origin:center top}
    .book3d.opened .coverFlap{transform:translateZ(calc(var(--d) / 2)) rotateX(165deg)}
    .coverBack{transform:rotateX(180deg);align-items:center;padding:0}
    .pageFace{padding:30px 26px 24px}
  }
  /* Reduced motion: no flying or swinging, but fades stay so changes don't
     feel broken. */
  @media (prefers-reduced-motion:reduce){
    .book,.eyebrow,h1,.sub,.hint{animation:none !important}
    .book3d.moving,.coverFlap,.book,.book-nav,.nav-close{transition-property:opacity !important}
  }
</style>

/* ---------- build shelf ---------- */
const shelf = document.getElementById('shelf');
const bookBtns = [];
const bookendStart = document.createElement('span');
bookendStart.className = 'bookend start';
bookendStart.setAttribute('aria-hidden','true');
shelf.appendChild(bookendStart);
books.forEach((b, i)=>{
  const btn = document.createElement('button');
  bookBtns.push(btn);
  btn.className = `book ${b.id}${b.lean ? ' leaning':''}`;
  btn.style.setProperty('--c', b.c);
  btn.style.setProperty('--t', b.t);
  btn.style.setProperty('--w', b.w+'px');
  btn.style.setProperty('--h', b.h+'px');
  btn.style.setProperty('--fs', b.fs);
  btn.style.animationDelay = (i * 45) + 'ms';   // staggered load rise
  btn.setAttribute('aria-label', `${b.title} by ${b.author}`);
  btn.innerHTML = b.spineHTML ||
    `<span class="spine"><span class="title">${b.title}</span><span class="author">${b.author}</span></span>`;
  btn.addEventListener('click', ()=>openBook(b, btn));
  shelf.appendChild(btn);
});
const bookendEnd = document.createElement('span');
bookendEnd.className = 'bookend end';
bookendEnd.setAttribute('aria-hidden','true');
shelf.appendChild(bookendEnd);

// Speak the device's language: "Tap" on touch screens.
if(window.matchMedia('(hover: none)').matches){
  document.querySelector('.hint-text').textContent = 'Tap a spine to pull it off the shelf';
}

/* ---------- 3D open / close ---------- */
const stage    = document.getElementById('stage');
const book3d   = document.getElementById('book3d');
const backdrop = document.getElementById('backdrop');
const closeBtn = document.getElementById('closeBtn');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// phase: 'idle' | 'open' (a book is out or opening) | 'closing'
// Tracking a phase (instead of a hard busy lock) lets a close interrupt an
// in-progress open — grab a flying book and send it back (§3 interruptibility).
let phase = 'idle';
let activeBtn = null;
let startTransform = '';
let openTimer = null;
const closeTimers = [];

function clearOpenClose(){
  if(openTimer){ clearTimeout(openTimer); openTimer = null; }
  while(closeTimers.length) clearTimeout(closeTimers.pop());
}

const coverUrl = isbn => `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`;

/* preload real covers so they're ready before the book turns */
const coverCache = {};
/* saved covers (public/images/books) — warm the cache so they're ready */
books.forEach(b=>{ if(b.coverSrc){ const i = new Image(); i.src = b.coverSrc; } });
books.forEach(b=>{
  if(!b.isbn) return;
  const img = new Image();
  img.onload = ()=>{ if(img.naturalWidth > 1) coverCache[b.isbn] = img.src; };
  img.src = coverUrl(b.isbn);
});

function populate(b){
  book3d.className = `book3d ${b.id}`;
  book3d.style.setProperty('--c', b.c);
  book3d.style.setProperty('--t', b.t);
  book3d.style.setProperty('--edge', b.edge || '#EDE7DA');
  book3d.style.setProperty('--back', b.back || b.c);
  /* square-format books open as square objects */
  const rootBh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bh')) || 440;
  if(b.square){
    const size = Math.min(360, window.innerWidth * .82) + 'px';
    book3d.style.setProperty('--bw', size);
    book3d.style.setProperty('--bh', size);
  } else {
    book3d.style.removeProperty('--bw');
    book3d.style.removeProperty('--bh');
  }
  /* depth scales with the true spine-width : book-height ratio */
  const bhVal = b.square ? parseFloat(book3d.style.getPropertyValue('--bh')) : rootBh;
  book3d.style.setProperty('--d', Math.max(b.w * (bhVal / b.h), 26) + 'px');
  document.getElementById('coverTitle').textContent = b.title;
  document.getElementById('coverAuthor').textContent = b.author;
  document.getElementById('coverGenre').textContent = b.genre;
  document.getElementById('coverYear').textContent = b.year;
  // The checkout card inside the cover.
  const idx = books.indexOf(b);
  document.getElementById('cardNo').textContent = 'No. ' + String(idx + 1).padStart(2,'0');
  document.getElementById('cardTitle').textContent = b.title.charAt(0).toUpperCase() + b.title.slice(1);
  document.getElementById('cardAuthor').textContent = b.author;
  document.getElementById('cardGenre').textContent = b.genre;
  document.getElementById('cardYear').textContent = b.year;
  document.getElementById('bookCount').textContent = (idx + 1) + ' / ' + books.length;
  document.getElementById('note').textContent = b.note;
  document.getElementById('buyLink').href = b.link;
  document.getElementById('spineFace').innerHTML = b.spineHTML ||
    `<span class="spine ${b.id}"><span class="title" style="font-size:${b.fs}">${b.title}</span><span class="author">${b.author}</span></span>`;

  /* real cover if we have one; custom recreation or typographic cover otherwise */
  const front = document.getElementById('coverFront');
  const img = document.getElementById('coverImg');
  const custom = document.getElementById('coverCustom');
  front.classList.remove('has-img');
  front.classList.toggle('has-custom', !!b.coverHTML && !b.coverSrc);
  custom.innerHTML = b.coverHTML || '';
  img.src = '';
  if(b.coverSrc){
    img.src = b.coverSrc;
    front.classList.add('has-img');
  } else if(b.isbn && coverCache[b.isbn]){
    img.src = coverCache[b.isbn];
    front.classList.add('has-img');
  } else if(b.isbn){
    img.onload = ()=>{ if(img.naturalWidth > 1){ coverCache[b.isbn] = img.src; front.classList.add('has-img'); } };
    img.onerror = ()=>front.classList.remove('has-img');
    img.src = coverUrl(b.isbn);
  }
}

const bookNav = document.getElementById('bookNav');
const isPhone = ()=>window.matchMedia('(max-width:760px)').matches;
let activeIndex = -1;

/* Where the open book sits. On phones the spread stacks vertically (the
   cover swings up), so it is scaled to fit and nudged down to stay centred. */
function openedTransform(){
  if(!isPhone()) return 'translateX(22%) rotateY(0deg) scale(1)';
  // Fit the stacked spread between the top bar (~52px) and the browse
  // buttons (~92px), with a little air, and centre it in that space.
  const bh = book3d.offsetHeight;
  const top = 52, bottom = 92, air = 24;
  const room = window.innerHeight - top - bottom - air;
  const s = Math.min(.92, room / (bh * 2));
  const shift = (top - bottom) / 2;               // centre of the free space
  return `translateY(${(bh * s) / 2 + shift}px) rotateY(0deg) scale(${s})`;
}

function shelfTransform(btn){
  const rect = btn.getBoundingClientRect();
  const s = rect.height / book3d.offsetHeight;
  const dx = (rect.left + rect.width/2) - window.innerWidth/2;
  const dy = (rect.top + rect.height/2) - window.innerHeight/2;
  return `translate(${dx}px, ${dy}px) rotateY(90deg) scale(${s})`;
}

function showOpened(){
  book3d.style.transform = openedTransform();
  book3d.classList.add('opened');
  closeBtn.classList.add('show');
  bookNav.classList.add('show');
}

function openBook(b, btn){
  if(phase !== 'idle') return;
  phase = 'open';
  activeBtn = btn;
  activeIndex = books.indexOf(b);
  populate(b);
  stage.classList.add('on');
  document.body.style.overflow = 'hidden';
  document.body.classList.add('reading','has-opened');
  startTransform = shelfTransform(btn);
  book3d.classList.remove('closing');
  if(reduceMotion){
    btn.classList.add('taken');
    backdrop.classList.add('show');
    showOpened();
    closeBtn.focus();
    return;
  }
  book3d.classList.remove('moving');
  book3d.style.transform = startTransform;
  btn.classList.add('taken');
  backdrop.classList.add('show');
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(phase !== 'open') return;   // a close interrupted us before this frame
      book3d.classList.add('moving');
      book3d.style.transform = 'translate(0px, 0px) rotateY(0deg) scale(1)';
      // The cover starts to swing before the book has fully landed, so the
      // pull and the open read as one motion.
      openTimer = setTimeout(()=>{
        openTimer = null;
        showOpened();
        closeBtn.focus();
      }, 380);
    });
  });
}

function closeBook(){
  if(phase !== 'open') return;
  phase = 'closing';
  clearOpenClose();
  const btn = activeBtn;
  closeBtn.classList.remove('show');
  bookNav.classList.remove('show');
  const finish = ()=>{
    stage.classList.remove('on');
    backdrop.classList.remove('show');
    book3d.classList.remove('moving','closing');
    btn.classList.remove('taken');
    document.body.style.overflow = '';
    document.body.classList.remove('reading');
    btn.focus();
    activeBtn = null;
    activeIndex = -1;
    phase = 'idle';
  };
  if(reduceMotion){
    book3d.classList.remove('opened');
    finish();
    return;
  }
  // Cover closes while the book flies home: one quick motion, not two.
  startTransform = shelfTransform(btn);
  book3d.classList.add('moving','closing');
  book3d.classList.remove('opened');
  book3d.style.transform = startTransform;
  closeTimers.push(setTimeout(finish, 440));
}

/* Previous / next while a book is open. Keyboard swaps are instant; buttons
   and swipes get a short slide in the direction of travel. */
let swapping = false;
function go(dir, instant){
  if(phase !== 'open' || !book3d.classList.contains('opened') || swapping) return;
  const next = (activeIndex + dir + books.length) % books.length;
  const apply = ()=>{
    activeBtn.classList.remove('taken');
    activeIndex = next;
    activeBtn = bookBtns[next];
    activeBtn.classList.add('taken');
    populate(books[next]);
    book3d.classList.add('opened');
    book3d.style.transform = openedTransform();
  };
  if(instant || reduceMotion){ apply(); return; }
  swapping = true;
  const base = openedTransform();
  book3d.classList.remove('moving');
  book3d.style.transition = 'transform .16s cubic-bezier(.4,0,1,1), opacity .16s ease';
  book3d.style.transform = `translateX(${-dir * 40}px) ` + base;
  book3d.style.opacity = '0';
  setTimeout(()=>{
    book3d.style.transition = 'none';
    apply();
    book3d.style.transform = `translateX(${dir * 40}px) ` + openedTransform();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      book3d.style.transition = 'transform .24s cubic-bezier(.23,1,.32,1), opacity .2s ease';
      book3d.style.transform = openedTransform();
      book3d.style.opacity = '1';
      setTimeout(()=>{ book3d.style.transition = ''; swapping = false; }, 250);
    }));
  }, 160);
}
document.getElementById('prevBook').addEventListener('click', ()=>go(-1));
document.getElementById('nextBook').addEventListener('click', ()=>go(1));

/* Swipe sideways on the open book to browse. It follows the finger (with
   resistance), and a short flick counts as much as a long drag. */
(function(){
  let x0 = 0, t0 = 0, dx = 0, tracking = false, moved = false;
  book3d.addEventListener('pointerdown', e=>{
    if(phase !== 'open' || !book3d.classList.contains('opened') || swapping) return;
    if(e.pointerType === 'mouse') return;   // mouse users have the buttons and keys
    tracking = true; moved = false; x0 = e.clientX; t0 = e.timeStamp; dx = 0;
  });
  book3d.addEventListener('pointermove', e=>{
    if(!tracking) return;
    dx = e.clientX - x0;
    if(Math.abs(dx) > 8) moved = true;
    if(!moved) return;
    book3d.style.transition = 'none';
    book3d.style.transform = `translateX(${dx * .5}px) ` + openedTransform();
  });
  const end = ()=>{
    if(!tracking) return;
    tracking = false;
    if(!moved) return;
    const v = Math.abs(dx) / Math.max(1, performance.now() - t0);
    book3d.style.transition = 'transform .24s cubic-bezier(.23,1,.32,1)';
    book3d.style.transform = openedTransform();
    setTimeout(()=>{ book3d.style.transition = ''; }, 250);
    if(Math.abs(dx) > 60 || v > .4) go(dx < 0 ? 1 : -1);
  };
  book3d.addEventListener('pointerup', end);
  book3d.addEventListener('pointercancel', end);
  book3d.style.touchAction = 'pan-y';
})();

closeBtn.addEventListener('click', closeBook);
backdrop.addEventListener('click', closeBook);
document.addEventListener('keydown', e=>{
  if(phase === 'open' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')){
    e.preventDefault();
    go(e.key === 'ArrowRight' ? 1 : -1, true);
    return;
  }
  if(e.key !== 'Escape') return;
  // Esc closes/cancels an open book first; if nothing is open, it goes home.
  if(phase === 'open'){ closeBook(); }
  else if(phase === 'idle'){ window.location.href = '/'; }
});
window.addEventListener('resize', ()=>{
  if(phase === 'open' && book3d.classList.contains('opened')) book3d.style.transform = openedTransform();
});
</script>
  <script type="module">
    // Mount Agentation only on localhost so it never ships to production.
    if (["localhost", "127.0.0.1"].includes(location.hostname)) {
      try {
        const { createElement } = await import("react");
        const { createRoot } = await import("react-dom/client");
        const { Agentation } = await import("agentation");
        const root = document.createElement("div");
        document.body.appendChild(root);
        createRoot(root).render(createElement(Agentation));
      } catch (e) {
        console.error("Agentation failed to load", e);
      }
    }
  </script>
